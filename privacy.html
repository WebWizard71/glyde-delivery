<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy | Glyde Delivery</title>
  <meta name="description" content="Review the official Privacy Policy of Glyde Delivery. Learn how we utilize Firebase authentication, secure your profile data, and coordinate info with delivery partners.">
  <meta name="robots" content="index, follow">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared Dynamic Header Component -->
  <header id="app-header" class="app-header"></header>

  <!-- Document Main Container -->
  <main class="main-content">
    
    <!-- Rendered dynamically by js/app.js based on data-page -->
    <article id="doc-page-container" data-page="privacy">
      <!-- Fallback loader in case JavaScript is disabled -->
      <div style="text-align: center; padding: 4rem 1rem; color: var(--text-light-secondary);">
        <p>Loading Glyde Privacy Policy...</p>
      </div>
    </article>

  </main>

  <!-- Shared Dynamic Footer Component -->
  <footer id="app-footer" class="app-footer"></footer>

  <!-- Scripts -->
  <script src="js/constants.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
